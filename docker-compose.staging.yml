services:
  api:
    labels:
      - "traefik.enable=true"
      - "traefik.env=staging"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.api.priority=10"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.middlewares=strip-api"
      - "traefik.http.middlewares.strip-api.stripprefix.prefixes=/api"
      - "traefik.http.services.api.loadbalancer.server.port=3000"
      - "traefik.http.routers.api-docs.rule=PathPrefix(`/api-docs`)"
      - "traefik.http.routers.api-docs.priority=20"
      - "traefik.http.routers.api-docs.entrypoints=web"
      - "traefik.http.routers.api-docs.service=api"
      - "traefik.http.routers.images.rule=PathPrefix(`/images`)"
      - "traefik.http.routers.images.priority=10"
      - "traefik.http.routers.images.entrypoints=web"
      - "traefik.http.routers.images.service=api"

  web:
    labels:
      - "traefik.enable=true"
      - "traefik.env=staging"
      - "traefik.http.routers.web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web.priority=1"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.services.web.loadbalancer.server.port=80"

  traefik-staging:
    image: traefik:v2.11
    restart: unless-stopped
    ports:
      - "${STAGING_PORT:-8080}:80"
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=cesizen_backend"
      - "--providers.docker.constraints=Label(`traefik.env`,`staging`)"
      - "--entrypoints.web.address=:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend
