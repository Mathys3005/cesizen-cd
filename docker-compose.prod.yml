services:
  api:
    labels:
      - "traefik.enable=true"
      - "traefik.env=prod"
      - "traefik.docker.network=cesizen-prod_backend"
      # /api/* → api:3000/* (strip du préfixe /api)
      - "traefik.http.routers.api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api.middlewares=strip-api"
      - "traefik.http.middlewares.strip-api.stripprefix.prefixes=/api"
      - "traefik.http.services.api.loadbalancer.server.port=3000"
      # /api-docs → api:3000/api-docs (sans strip)
      - "traefik.http.routers.api-docs.rule=Host(`${DOMAIN}`) && PathPrefix(`/api-docs`)"
      - "traefik.http.routers.api-docs.priority=20"
      - "traefik.http.routers.api-docs.entrypoints=websecure"
      - "traefik.http.routers.api-docs.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api-docs.service=api"
      # /images/* → api:3000/images/* (sans strip)
      - "traefik.http.routers.images.rule=Host(`${DOMAIN}`) && PathPrefix(`/images`)"
      - "traefik.http.routers.images.entrypoints=websecure"
      - "traefik.http.routers.images.tls.certresolver=letsencrypt"
      - "traefik.http.routers.images.service=api"

  web:
    labels:
      - "traefik.enable=true"
      - "traefik.env=prod"
      - "traefik.docker.network=cesizen-prod_backend"
      - "traefik.http.routers.web.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=80"

  traefik:
    image: traefik:v2.11
    profiles: ["production"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
      - traefik-logs:/logs
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=cesizen-prod_backend"
      - "--providers.docker.constraints=Label(`traefik.env`,`prod`)"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--accesslog=true"
      - "--accesslog.filepath=/logs/access.log"
    networks:
      - backend

  fail2ban:
    image: crazymax/fail2ban:latest
    profiles: ["production"]
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - traefik-logs:/var/log/traefik:ro
      - ./fail2ban/filter.d:/data/filter.d:ro
      - ./fail2ban/jail.d:/data/jail.d:ro
      - fail2ban-db:/data/db
    environment:
      - TZ=Europe/Paris
      - F2B_LOG_LEVEL=INFO

volumes:
  traefik-certs:
  traefik-logs:
  fail2ban-db:
