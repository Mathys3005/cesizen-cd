# ── HTTP ───────────────────────────────────────────────────────
# Phase 1 : HTTP uniquement (avant Certbot)
# Phase 2 : ajouter le bloc HTTPS + redirect HTTP→HTTPS après obtention des certs
server {
    listen 80;
    server_name _;

    # Certbot (déjà prêt pour la phase 2)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API : /api/* → api:3000 (sans le préfixe /api)
    location /api/ {
        proxy_pass         http://api:3000/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Swagger
    location /api-docs {
        proxy_pass         http://api:3000/api-docs;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Images statiques
    location /images/ {
        proxy_pass         http://api:3000/images/;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Frontend : tout le reste
    location / {
        proxy_pass         http://web:80/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
