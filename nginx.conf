server {
    listen 80;
    server_name cesizen.switzerlandnorth.cloudapp.azure.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name cesizen.switzerlandnorth.cloudapp.azure.com;

    ssl_certificate     /etc/letsencrypt/live/cesizen.switzerlandnorth.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cesizen.switzerlandnorth.cloudapp.azure.com/privkey.pem;

    location /api/ {
        proxy_pass         http://api:3000/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api-docs {
        proxy_pass         http://api:3000/api-docs;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /images/ {
        proxy_pass         http://api:3000/images/;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://web:80/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
